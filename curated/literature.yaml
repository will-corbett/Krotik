# Texts for the Reading section. Literature is fetched from Russian Wikisource at the revision given (so the build is
# reproducible and checkable), in modern spelling. Both authors died more than 70 years ago (Tolstoy 1910, Chekhov
# 1904) and the works were published in their lifetimes, so the texts are in the public domain everywhere; only the
# author's text is used (no editors' notes or commentary).
#
# News: articles from Russian Wikinews (CC BY), at fixed revisions, credited to Wikinews contributors with a link to
# the revision. Only articles written by Wikinews contributors themselves (never the bot copies of other outlets'
# articles marked "Загружено ботом"), none copying another outlet's text word for word, none citing a sanctioned outlet,
# nothing on the war, and politics only as history (events before 2014). The first set is science, space and nature.
#
# Passages with a word that isn't in our data or Wiktionary, that Wiktionary marks only as archaic, obsolete or
# dated, or with the old polite -с particle (слушаю-с) or Latin script, are left out and listed in the report.
#
#   id        file name and key
#   author    as written in Russian; authorEn; died (year)
#   title     the work; year first published
#   page      Wikisource page title; revision = its oldid
#   kind      stories (one story per section) | play (scenes of dialogue)
#   level     [lowest, highest] CEFR-style level it suits
