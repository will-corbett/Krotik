# Public-domain literature for the "Read and fill in" drill. Each text is fetched from Russian Wikisource at the
# revision given (so the build is reproducible and checkable), in modern spelling. Both authors died more than
# 70 years ago (Tolstoy 1910, Chekhov 1904) and the works were published in their lifetimes, so the texts are in the
# public domain everywhere; only the author's text is used (no editors' notes or commentary).
#
# Passages with a word that isn't in our data or Wiktionary, that Wiktionary marks only as archaic, obsolete or
# dated, or with the old polite -с particle (слушаю-с) or Latin script, are left out and listed in the report.
#
#   id        file name and key
#   author    as written in Russian; authorEn; died (year)
#   title     the work; year first published
#   page      Wikisource page title; revision = its oldid
#   kind      stories (one story per section) | play (scenes of dialogue)
#   level     [lowest, highest] CEFR-style level it suits
works:
  - id: tolstoy-reader-2
    author: Лев Толстой
    authorEn: Leo Tolstoy
    died: 1910
    title: Вторая русская книга для чтения
    titleEn: "Second Russian reader: stories, fables and true tales for children"
    year: 1875
    page: Вторая русская книга для чтения (Толстой)
    revision: 5753941
    kind: stories
    level: [A2, B1]
  - id: chekhov-bear
    author: Антон Чехов
    authorEn: Anton Chekhov
    died: 1904
    title: Медведь
    titleEn: "The Bear: a joke in one act"
    year: 1888
    page: Медведь (Чехов)
    revision: 5718680
    kind: play
    level: [B2, C1]
  - id: chekhov-proposal
    author: Антон Чехов
    authorEn: Anton Chekhov
    died: 1904
    title: Предложение
    titleEn: "The Proposal: a joke in one act"
    year: 1888
    page: Предложение (пьеса, Чехов)
    revision: 5642339
    kind: play
    level: [B2, C1]

# Words Wiktionary tags as dated or archaic where the tag isn't about the word itself (checked by hand). Each needs a
# reason; everything else Wiktionary marks old stays out.
notOld:
  иначе: Wiktionary's "dated" refers to the old stress и́наче; the word (ина́че) is everyday Russian.

# English meanings written by hand for words in the texts that neither our data nor Wiktionary explains (keys in lower
# case, ё as е). These are our words about the author's words, checked against the context. "(old) " at the start
# also labels the word old-fashioned. Hunting terms in Предложение get their general sense only.
glosses:
  взлезли: climbed up (colloquial for влезли)
  смотренье: looking, viewing (here, seeing the animals)
  съеденье: being eaten (на съеденье, to be eaten)
  понатужься: strain a bit harder, push yourself
  погоревал: grieved for a while (from погоревать)
  погоревали: grieved for a while (from погоревать)
  дадена: given (colloquial for дана)
  осьмушку: an eighth (of a pound); here, an extra measure of oats
  дозарезу: desperately, badly (needed)
  брр: brr (a shudder of cold or anger)
  фуй: ugh! (disgust)
  поджилки: the backs of the knees; поджилки трясутся, his knees are shaking
  холерина: (old) a mild stomach upset
  ву: French vous; Smirnov mocks French politeness (же ву при…, je vous prie, "I beg you")
  напужал: frightened (colloquial for напугал)
  равноправность: (old) equality, equal rights (now равноправие)
  сантиментальный: (old) sentimental (now spelt сентиментальный)
  разлимонился: went all soft (a joking word)
  рассиропился: turned to syrup, got soppy (a joking word)
  втюрился: fell head over heels in love (slang)
  капсюльные: percussion-cap (of old pistols)
  экстрактором: with an extractor (the part of a revolver that throws out spent cartridges)
  счастие: (old) happiness (now счастье)
  дерг: jerk! (a sudden twitch, from дёргать)
  тетушкина: the aunt's (from тётушка)
  сжадничала: was greedy (from сжадничать)
  милаша: darling, dear (colloquial)
  сутяжный: fond of lawsuits, litigious
  поскорей: sooner, quickly (colloquial for поскорее)
  уродлив: ugly (short form of уродливый)
  четвертная: a quarter; here, twenty-five roubles
  доезжачий: the huntsman in charge of the hounds
  чистопсовый: a purebred borzoi (hunting term)
  крутобедрый: with strong, curved haunches (of a hunting dog)
  муругопегого: brindled with white patches (a dog's colouring)
  подуздоват: with the lower jaw shorter than the upper, a fault in a borzoi (Lomov explains it himself)
  подуздоватая: with the lower jaw shorter than the upper, a fault in a borzoi (Lomov explains it himself)
  непоимиста: bad at catching the quarry (of a hunting dog)
  опсовел: hasn't grown into a mature borzoi yet (hunting term)
  розвязи: a borzoi's build and proportions (hunting term)
  угонки: the chase (hunting term)
  на-завладай: for seizing the quarry at the end of the chase (hunting term)
  медоточил: spoke honeyed words (from медоточить)
  ненавистницы: women who hate (from ненавистница)
  обыкновеннейший: the most ordinary (from обыкновенный)
  полубогиня: a demigoddess
  созданье: a creature (another form of создание)
