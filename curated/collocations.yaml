# Words that go together: a verb and the noun it is used with (принять решение, сделать ошибку), where English uses a
# different verb or none, so the pair has to be learnt. Grammar facts only, never forms: every form comes from the
# data, and each pair must occur in a real Tatoeba sentence (the verb, then the noun within three words, in the case
# given), or it isn't used and the report lists it.
#
#   noun     dictionary form
#   verbs    [imperfective, perfective], or one verb
#   case     the noun's case after the verb: acc (the default) or gen; pl: true when it's used in the plural;
#            sg: true when only the singular has this meaning (дать слово, but not брать слова обратно)
#   prep     a preposition that follows, as a note (обратить внимание на …)
#   en       our English, for the pair
