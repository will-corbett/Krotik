# Grammar test stage 2 (typed answers): other forms that are also right.
#
# In stage 2 the learner types the form of the word in brackets, with the English as the cue. The word in brackets
# doesn't always decide the form: after я or ты a past verb can be masculine or feminine (я ел / я ела), and an
# English "you" can be ты or вы. Every form a question should also accept is listed here under the question's key
# (reports/grammar-test-stage2-for-review.keys.json maps the review file's numbers to keys).
#
# Rule (2026-11-10, with a native speaker's notes): accept every form that is right in the Russian sentence and fits
# the English. Where the English can't tell (gender, ты/вы), accept all. A predicate adjective takes its short form,
# and its long form where that is also said (жива / живая, был обнажён / обнажённым / обнажённый). An imperative
# takes the other aspect where both are said (просни́тесь / просыпа́йтесь). Forms may be of the word in brackets, its
# participles, or its aspect partner. Forms only, never made up: the data build checks that every form listed
# is a real form (of the word, its participles or its aspect partner), and fails if not. A key the build no longer finds (after a source refresh)
# is listed in the report. Stage 2 stays off the site until a native speaker has reviewed the list
# (STAGE2_PUBLISHED in src/lib/levelTest.ts).

