# Grammar test stage 2 (typed answers): the questions it may ask, fixed.
#
# These are the 228 questions sent for native review on 2026-11-10 (reports/grammar-test-stage2-for-review.md, made
# from this file by `npm run review:stage2`; its numbers are the order here). They're stored here, not drawn from the
# data build, because the build's random draw changes whenever the Tatoeba export does (monthly, and between
# machines): the reviewed questions must stay exactly the ones reviewed.
#
# Each question: a real Tatoeba sentence (`ru`, `en`, CC BY 2.0 FR), the gap as [start, end] in `ru`, the word given
# in brackets, and every answer accepted. The first answer is the sentence's own word.
#
# Rule for answers (2026-11-10, with a native speaker's notes): accept every form that is right in the Russian
# sentence and fits the English. Where the English can't tell (gender, ты/вы), accept all. A predicate adjective takes
# its short form, and its long form where that is also said (жива / живая). An imperative takes the other aspect where
# both are said (послушай / слушай).
#
# The data build checks every question: the gap holds the first answer, and every answer is a real form of the word,
# its participles or its aspect partner (never made up); it fails otherwise. Edit answers here when the reviewer
# replies. Stage 2 stays off the site until the review is done (STAGE2_PUBLISHED in src/lib/levelTest.ts).

