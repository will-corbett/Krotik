<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Learn and practise Russian: grammar explained with real examples, instant drills, vocabulary by theme from A1 to C1, a grammar test, real literature with every word explained, and hand-picked culture links. Free, no login." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/krotik-32.png" />
    <link rel="apple-touch-icon" href="/brand/krotik-180.png" />
    <meta name="theme-color" content="#fdf2e7" />
    <title>Krotik</title>
    <script>
      try {
        const t = JSON.parse(localStorage.getItem('krotik.settings.v1') || localStorage.getItem('rgd.settings.v1') || '{}').theme || 'krotik';
        if (t === 'light' || t === 'dark' || t === 'krotik') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
