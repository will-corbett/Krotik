      imperative_pl: "дожди'тесь" # source: дождала'и'тесь
      presfut_sg1: "дожду'сь" # source: дождала'ю'сь
      presfut_sg2: "дождёшься" # source: дождала'ёшься
      presfut_sg3: "дождётся" # source: дождала'ётся
      presfut_pl1: "дождёмся" # source: дождала'ёмся
      presfut_pl2: "дождётесь" # source: дождала'ётесь
      presfut_pl3: "дожду'тся" # source: дождала'ю'тся
