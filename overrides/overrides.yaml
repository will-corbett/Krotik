# Hand-maintained corrections, applied to raw source rows before cleaning.
# Keys are the source `bare` field; a fix applies to the first (most frequent) row with that bare form.
# Columns use the source CSV column names. Raw cell syntax: variants separated by "," ;
# "(x)" = optional/archaic variant (accepted, not shown); "-" = intentionally absent.
#
# Every form in a `fix` must be attested in Wiktionary: `npm run data:verify-overrides`
# checks each one against kaikki.org's per-word extract and fails if a form is not found.

verbs:
  fix:
    быть:
      # Source gives "есть" for all six persons. Present-tense drilling of быть is meaningless;
      # keep past and imperative only.
      presfut_sg1: "-"
      presfut_sg2: "-"
      presfut_sg3: "-"
      presfut_pl1: "-"
      presfut_pl2: "-"
      presfut_pl3: "-"
    накалять:
      # imperative_sg and past_pl are swapped in the source.
      imperative_sg: "накаля'й"
      past_pl: "накаля'ли"
    соскучиться:
      presfut_sg2: "соску'чишься" # source: соску'шься
  exclude:
    размежёвывать: all six present forms are the 1sg form
    выпуститься: past f/n/pl forms are non-reflexive and mismatched
    надобиться: past forms garbled (надобила/надобило/надобило)
  gloss:
    говорить: speak, talk # source: "speak, talk gapirish" (Uzbek)
    посадить: plant, seat, land (a plane)
    подвести: bring up, lead up, let down # source starts with a Greek word
    устроиться: settle in, get a job, get oneself set up
    пройтись: take a walk, stroll
    раздаваться: be heard, resound
    казнить: execute, put to death
    увлечься: be carried away, get absorbed in

adjectives:
  fix: {}
  exclude: {}
  gloss:
    абстрактный: abstract # source: "abstract, soyut"
    непроницаемый: impenetrable, impervious
    драный: torn, ragged
    товарищеский: comradely, friendly
    лёгочный: pulmonary, lung
    крестьянский: peasant

nouns:
  fix:
    год:
      # Source gives only the irregular лета́ plural; Wiktionary lists го́ды/года́ first
      # and лет/годо́в for the genitive. лета́ forms kept as optional variants.
      pl_nom: "го'ды,года',(лета')"
      pl_gen: "ле'т,годо'в"
      pl_dat: "года'м,(лета'м)"
      pl_acc: "го'ды,года',(лета')"
      pl_inst: "года'ми,(лета'ми)"
      pl_prep: "года'х,(лета'х)"
  exclude:
    мол: "the particle мол (“he says”) merged with the rare noun мол (breakwater); not a useful noun to drill"
    стен: "the obsolete unit sthene; the word is really the genitive plural of стена"
  # Typos and garbled glosses in the source (spotted by a dictionary scan of the top 2,500).
  gloss:
    хозяйка: "mistress, owner, proprietress, hostess, landlady, wife"
    огород: "vegetable garden, kitchen garden"
    закуска: "appetizer, snack, hors d'oeuvre"
    презрение: "contempt, scorn, disdain"
    земляк: "fellow countryman, fellow townsman, fellow villager"
    прикосновение: "touch, contact"
    охранник: "guard, security guard"
    сталкер: "stalker; someone who explores off-limits places"
  # Form used after numbers 5+ and after сколько/несколько, where it differs from the ordinary
  # genitive plural (пять челове'к, not *пять люде'й; пять ле'т, not *пять годо'в).
  # Both are listed by Wiktionary as genitive plural forms of the noun.
  counting:
    человек: "челове'к"
    год: "ле'т"

sentences:
  # Tatoeba sentence id → reason
  deny:
    4763116: "vulgar English translation; was picked as a Learn page example"


adverbs:
  # adjective bare → reason. The adjective gets no "make the adverb" question.
  exclude:
    должный: "должно' is a predicative (должно быть), not the adverb of должный"
    добрый: "добро' as an adverb is dated; the everyday word is the noun добро'"

vocab:
  # word (bare, as in the source) → reason. Left out of the Vocabulary drill's word lists (the word stays in the
  # grammar drills). Nouns and adjectives spelt like a verb or other word are left out automatically.
  exclude:
    ж: "a clipped же, not a word to learn on its own"
    ко: "a variant of к before some consonant clusters, taught with к"
    чтоб: "a colloquial чтобы, taught with чтобы"
  # Nouns and adjectives spelt like a verb or other word are left out unless listed here (word → why it's worth
  # learning; checked by hand).
  keep:
    сволочь: "scum (rude); a common noun"
    честь: "honour; an everyday noun (the verb честь is archaic)"
    течь: "a leak; common noun"
    пасть: "jaws, mouth (of an animal)"
    напасть: "misfortune"
    почесть: "honour, tribute"
  # word → English meaning, where the source's is misleading or too long for a card
  gloss:
    у: "by, at; (у меня) I have"
    она: "she, it"
    оно: "it"
    пока: "while; for now; bye"
    куда: "where (to)"
    к: "to, towards"
    за: "behind; for"
    по: "along; on, about; by"
    до: "to, as far as; until; before"
    таки: "after all, still"
    равно: "equally"
    тяжело: "heavily; it is hard"
    трое: "three (people)"
    двое: "two (people)"
