      imperative_pl: "вы'разите"
    выстоять:
      imperative_sg: "вы'стой" # source: вы'стоь
      imperative_pl: "вы'стойте"
    вытащить:
      imperative_sg: "вы'тащи" # source: вы'тащь
      imperative_pl: "вы'тащите"
    выявить:
      imperative_sg: "вы'яви" # source: вы'явь
      imperative_pl: "вы'явите"
    # Imperative audit (2026-11-09): source imperatives that match none of Wiktionary's. Forms taken from Wiktionary;
    # the present/future and past are fixed too where the source has them wrong.
    дождаться:  # source garbles every future and imperative form (дождала'ю'сь); Wiktionary: дожду́сь, дождёшься …, дожди́сь
