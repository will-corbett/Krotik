# Culture page links. Hand-picked; each one checked by hand on the date in `checked`, and by
# `npm run links:check` (monthly in CI) since.
#
# Rules (see CLAUDE.md):
# - Only official sources: a creator's or rights holder's own channel or site. No re-uploads, no music,
#   no lyrics, no sanctioned outlets, nothing whose main theme is politics or the war.
# - Links only: nothing is embedded or copied. Descriptions are our own words.
# - Nothing that would stop the site being run commercially later (we only link).
#
# Fields:
#   title    name as the source gives it
#   url      https link
#   type     video | cartoons | podcast | reading | tool
#   kind     learner (made for learners) | native (made for Russian speakers)
#   level    [lowest, highest] CEFR level it suits: A1 A2 B1 B2 C1 C2
#   region   where it is made or about: russia | kazakhstan | ukraine | georgia | worldwide
#   about    one or two sentences, in English, our own words
#   note     optional caveat shown with the link
#   checked  date it was last checked by hand

