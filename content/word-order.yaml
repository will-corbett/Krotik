# Word order practice: a question, and two orders of the same answer. Both are grammatical Russian; the one that
# answers the question naturally puts the new information (what the question asks for) last. Our own Russian:
# word-checked by the data build, and published only once a native speaker has reviewed each item
# (`reviewed: "<who>, YYYY-MM-DD"`). Until then it's listed in reports/word-order-for-review.md.
#
#   q, qen     the question, and its English
#   right      the natural answer; other: the same words in the other order
#   en         the answer's English
