# Comprehension questions for the Reading section. A text is published only when it has questions here (and every
# word in it can be explained). Each question has the same options, in the same order, in English and Russian;
# `answer` is the index of the right one. Questions are about what happens and why, never about the wording.
# The Russian is ours, so every word must be a real form in the data or a word of the text itself
# (tests/unit/learn.test.ts checks this, as it does for Learn pages).
#
#   id       the address: /reading/<id>/
#   work     an id from curated/literature.yaml; section = the story's title or "Явление N"

