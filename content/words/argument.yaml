title: Abstract ideas and argument
ru: Абстрактные понятия
level: C1
blurb: "The vocabulary of essays and discussion: causes, trends, contradictions and consequences."
names: []
# Hand-chosen In use sentences (Tatoeba ids), where the shortest was an idiom or another sense of the word.
use:
  неизбежный: 12074811
groups:
  - title: "Ideas"
    words: ["понятие = concept, notion (понятия не имею: no idea)", "явление = phenomenon", "предпосылка = precondition, premise", "тенденция = tendency, trend", "противоречие = contradiction", "последствие = consequence", "суть = essence, gist", "смысл = meaning, sense, point"]
  - title: "Reasoning"
    words: ["подразумевать = imply, mean", "вытекать = flow out; follow (from)", "предполагать = suppose, assume", "опровергнуть = refute, disprove", "обосновать = justify, substantiate", "учитывать = take into account", "недооценивать = underestimate", "преувеличивать = exaggerate"]
  - title: "Judging"
    words: ["неизбежный = inevitable", "очевидный = obvious", "сомнительный = doubtful, questionable", "существенный = significant, essential", "целесообразный = advisable, expedient", "двусмысленный = ambiguous", "общепринятый = generally accepted"]
dialogues:
  - title: "A seminar"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Преподаватель, "Какие последствия может иметь эта тенденция?", "What consequences could this trend have?"]
      - [Анна, "На мой взгляд, они неизбежны, хотя их часто недооценивают.", "In my view they are inevitable, although people often underestimate them."]
      - [Преподаватель, "Вы можете обосновать свою точку зрения?", "Can you justify your point of view?"]
      - [Анна, "Да. Из этих данных вытекает, что проблема существенная.", "Yes. It follows from these data that the problem is significant."]
      - [Преподаватель, "Хорошо. Но учитывайте и другие причины.", "Good. But take other causes into account too."]
  - title: "Is that obvious?"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Дима, "По-моему, ответ очевиден.", "I think the answer is obvious."]
      - [Катя, "Не уверена. В твоём рассуждении есть противоречие.", "I'm not sure. There is a contradiction in your reasoning."]
      - [Дима, "Какое?", "What is it?"]
      - [Катя, "Ты предполагаешь, что все думают одинаково. Это сомнительно.", "You assume everyone thinks the same way. That's doubtful."]
      - [Дима, "Ты права, я, кажется, преувеличил.", "You're right, I think I exaggerated."]
