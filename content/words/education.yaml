  - title: "A hard lecture"
    reviewed: ""
    lines:
      - [Дима, "Ты была сегодня на лекции?", "Were you at the lecture today?"]
      - [Катя, "Была, но мало что поняла. Профессор говорил очень быстро.", "I was, but I understood very little. The professor spoke very fast."]
      - [Дима, "Пойдём в библиотеку, возьмём учебник.", "Let's go to the library and get the textbook."]
      - [Катя, "Хорошо. Мне нужна хорошая оценка, иначе не будет стипендии.", "All right. I need a good mark, or I will lose my grant."]
