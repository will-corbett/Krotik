dialogues:
  - title: "After school"
    reviewed: ""
    lines:
      - [Олег, "Что ты будешь делать после школы?", "What will you do after school?"]
      - [Маша, "Хочу учиться в университете на факультете журналистики.", "I want to study journalism at university."]
      - [Олег, "А экзамены уже сдала?", "Have you taken your exams yet?"]
      - [Маша, "Ещё нет. Последний экзамен в июне.", "Not yet. The last exam is in June."]
