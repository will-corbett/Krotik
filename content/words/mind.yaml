dialogues:
  - title: "Stress"
    reviewed: ""
    lines:
      - [Анна, "Ты в последнее время очень нервный.", "You've been very tense lately."]
      - [Олег, "Да, на работе стресс. Я плохо сплю.", "Yes, there is stress at work. I'm sleeping badly."]
      - [Анна, "Тебе нужно отдохнуть и больше гулять.", "You need to rest and go out for walks more."]
      - [Олег, "Знаю, но не могу сосредоточиться ни на чём, кроме работы.", "I know, but I can't concentrate on anything except work."]
      - [Анна, "Попробуй хотя бы вечером не думать о ней.", "Try at least not to think about it in the evening."]
  - title: "A good memory"
    reviewed: ""
    lines:
      - [Дима, "Как ты запоминаешь столько слов?", "How do you remember so many words?"]
      - [Маша, "У меня есть привычка: каждый день я учу десять новых слов.", "I have a habit: every day I learn ten new words."]
      - [Дима, "А я всё время забываю.", "And I keep forgetting."]
      - [Маша, "Главное — мотивация. Представь, что ты уже свободно говоришь.", "The main thing is motivation. Imagine you already speak fluently."]
