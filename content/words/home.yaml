title: Home
ru: Дом
level: A1
blurb: Rooms, furniture and everyday life at home.
names: []
groups:
  - title: Where you live
    words: ["дом = house, home", "квартира = flat, apartment", этаж, комната, "кухня = kitchen", "спальня = bedroom", ванная, "туалет = toilet", балкон]
  - title: Furniture and things
    words: ["стол = table", стул, "кровать = bed", диван, "шкаф = cupboard, wardrobe", "окно = window", дверь, "лампа = lamp", "холодильник = fridge"]
  - title: At home
    words: [жить, спать, "убирать = tidy up, clear away", мыть, "открыть = open", "закрыть = close, shut", "удобный = comfortable, convenient", "чистый = clean"]
dialogues:
  - title: "A new flat"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Катя, "Какая у тебя большая квартира!", "What a big flat you have!"]
      - [Анна, "Да, три комнаты: спальня, гостиная и кабинет.", "Yes, three rooms: a bedroom, a living room and a study."]
      - [Катя, "А кухня большая?", "Is the kitchen big?"]
      - [Анна, "Нет, маленькая, но удобная.", "No, small, but convenient."]
      - [Катя, "А на каком этаже ты живёшь?", "And which floor do you live on?"]
      - [Анна, "На пятом. Есть балкон, и из окна видно парк.", "On the fifth. There is a balcony, and you can see the park from the window."]
  - title: "Tidying up"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Олег, "Где моя книга? Она была на столе.", "Where is my book? It was on the table."]
      - [Анна, "Я убиралась и положила её в шкаф.", "I was tidying up and put it in the cupboard."]
      - [Олег, "Спасибо. А почему окно открыто?", "Thanks. And why is the window open?"]
      - [Анна, "Здесь было жарко. Закрой его, если холодно.", "It was hot in here. Close it if you are cold."]
      - [Олег, "Нет, не холодно. Пусть будет открыто.", "No, I am not cold. Leave it open."]
