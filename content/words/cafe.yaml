    words: ["кафе = café", ресторан, "столик = (small) table", "меню = menu", официант, "счёт = the bill"]
  - title: Ordering
    words: ["хотеть = want", "взять = take", "заказать = order", "принести = bring", "можно = may I, can I; it is possible", "ещё = more, another; still", "чашка = cup", стакан, "кусок = piece, slice"]
