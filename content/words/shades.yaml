title: Shades of meaning
ru: Оттенки значения
level: C1
blurb: "Words that look alike in a dictionary but are not the same: which one, when."
names: []
groups:
  - title: "Looking"
    words: ["смотреть = look, watch (the everyday word)", "глядеть = look, gaze (more vivid, often colloquial)", "взглянуть = glance, take a look", "разглядеть = make out, see clearly", "наблюдать = observe, watch closely", "замечать = notice"]
  - title: "Clever and wise"
    words: ["умный = clever, intelligent", "мудрый = wise (from experience)", "проницательный = perceptive, astute", "сообразительный = quick-witted", "образованный = educated, well-read"]
  - title: "Saying"
    words: ["говорить = speak, say (general)", "сказать = say (once)", "заявить = declare, state (publicly)", "утверждать = claim, maintain", "намекать = hint", "упомянуть = mention", "признаться = admit, confess"]
  - title: "Big and important"
    words: ["большой = big", "огромный = huge", "значительный = considerable, significant", "важный = important", "значимый = meaningful, significant"]
dialogues:
  - title: "Which word?"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Маша, "Какая разница между «смотреть» и «глядеть»?", "What is the difference between «смотреть» and «глядеть»?"]
      - [Олег, "«Смотреть» — обычное слово. «Глядеть» чаще встречается в разговоре и в литературе.", "«Смотреть» is the ordinary word. «Глядеть» is more common in conversation and in literature."]
      - [Маша, "А «наблюдать»?", "And «наблюдать»?"]
      - [Олег, "Это смотреть внимательно и долго. Учёные наблюдают, а не просто смотрят.", "That means watching carefully for a long time. Scientists observe, they do not just look."]
  - title: "Clever or wise?"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Катя, "Твой дедушка очень умный человек.", "Your grandfather is a very clever man."]
      - [Дима, "Скорее мудрый. Он не учился в университете, но много понимает.", "Wise, more like. He didn't go to university, but he understands a lot."]
      - [Катя, "Значит, умный — это про знания, а мудрый — про опыт?", "So clever is about knowledge, and wise is about experience?"]
      - [Дима, "Примерно так. И он очень проницательный: сразу видит, что ты чувствуешь.", "Roughly. And he's very perceptive: he sees straight away what you feel."]
