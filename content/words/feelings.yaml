title: Feelings and character
ru: Чувства и характер
level: B1
blurb: How you feel, and what people are like.
names: []
groups:
  - title: Feelings
    words: [чувство, "радость = joy", "страх = fear", "грусть = sadness", "счастливый = happy", "весёлый = cheerful, merry", "грустный = sad", "злой = angry; wicked", "спокойный = calm"]
  - title: Feeling it
    words: ["бояться = be afraid (of)", "волноваться = worry, be nervous", "радоваться = be glad, be happy (about)", "нравиться = please (мне нравится: I like)", "скучать = be bored; miss (someone)", сердиться, "удивиться = be surprised"]
  - title: Character
    words: ["характер = character, nature", "добрый = kind", "умный = clever", "честный = honest", вежливый, ленивый, "смелый = brave", "скромный = modest", "упрямый = stubborn"]
dialogues:
  - title: "Good news"
    reviewed: ""
    lines:
      - [Анна, "Почему ты такой весёлый?", "Why are you so cheerful?"]
      - [Олег, "Меня взяли на новую работу!", "I've got a new job!"]
      - [Анна, "Как я рада за тебя!", "I'm so happy for you!"]
      - [Олег, "Я немного волнуюсь, но очень счастлив.", "I'm a bit nervous, but very happy."]
      - [Анна, "Не бойся, ты справишься.", "Don't be afraid, you'll manage."]
  - title: "What is he like?"
    reviewed: ""
    lines:
      - [Олег, "Какой у тебя брат?", "What is your brother like?"]
      - [Анна, "Он добрый и умный, но очень упрямый.", "He's kind and clever, but very stubborn."]
      - [Олег, "Он на тебя похож?", "Is he like you?"]
      - [Анна, "Нет, я спокойная, а он всегда спорит.", "No, I am calm, and he always argues."]
      - [Олег, "Значит, с ним не скучно!", "So it's never boring with him!"]
