title: Daily routine
ru: Распорядок дня
level: A1
blurb: "Getting up, the working day, and going to bed."
names: [Таня]
# Hand-chosen In use sentences (Tatoeba ids), where the shortest was an idiom or another sense of the word.
use:
  проснуться: 2590250
  всегда: 1496125
groups:
  - title: Morning
    words: ["вставать = get up", "встать = get up; stand up", "просыпа'ться = wake up", "проснуться = wake up", умываться, "одеваться = get dressed", "завтракать = have breakfast", будильник]
  - title: The day
    words: [работать, "учиться = study", "обедать = have lunch", "отдыхать = rest, relax", "гулять = go for a walk", "домой = (to) home", дома]
  - title: Evening
    words: [вечером, "ложиться = lie down; go to bed", "лечь = lie down; go to bed", спать, "душ = shower", зуб, "устать = get tired"]
  - title: How often
    words: ["каждый = every, each", "обычно = usually", всегда, иногда, редко, утром, "днём = in the daytime, in the afternoon"]
dialogues:
  - title: "An ordinary day"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Анна, "Во сколько ты обычно встаёшь?", "What time do you usually get up?"]
      - [Олег, "В семь. Потом принимаю душ и завтракаю.", "At seven. Then I have a shower and breakfast."]
      - [Анна, "А когда ты начинаешь работать?", "And when do you start work?"]
      - [Олег, "В девять. Обедаю в час, а домой прихожу в шесть.", "At nine. I have lunch at one and get home at six."]
      - [Анна, "А что ты делаешь вечером?", "And what do you do in the evening?"]
      - [Олег, "Ужинаю, гуляю с собакой и рано ложусь спать.", "I have dinner, walk the dog and go to bed early."]
  - title: "The alarm clock"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Мама, "Таня, вставай! Уже восемь часов!", "Tanya, get up! It's already eight o'clock!"]
      - [Таня, "Как восемь? Почему будильник не звонил?", "What do you mean, eight? Why didn't the alarm go off?"]
      - [Мама, "Не знаю. Быстрее одевайся и умывайся.", "I don't know. Hurry up, get dressed and wash."]
      - [Таня, "А завтракать некогда!", "And there's no time for breakfast!"]
      - [Мама, "Возьми с собой бутерброд.", "Take a sandwich with you."]
