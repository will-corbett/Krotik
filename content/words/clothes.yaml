title: Clothes
ru: Одежда
level: A1
blurb: What you wear, colours and sizes.
names: []
# Hand-chosen In use sentences (Tatoeba ids), where the shortest was an idiom or didn't fit the theme.
use:
  цвет: 2502740
  красный:a: 11905715
  белый:a: 9150806
groups:
  - title: Clothes
    words: ["одежда = clothes", "рубашка = shirt", "футболка = T-shirt", "брюки = trousers", джинсы, "платье = dress", юбка, куртка, пальто, "шапка = hat, cap", "обувь = footwear, shoes", "ботинок = boot, shoe", носок]
  - title: Colours
    words: ["цвет = colour", белый:a, чёрный, красный:a, "синий = blue", зелёный:a, "жёлтый = yellow", "серый = grey"]
  - title: Wearing and buying
    words: ["носить = wear; carry", надеть, "снять = take off", "размер = size", "большой = big, large", "маленький = small, little", "новый = new"]
dialogues:
  - title: "Trying things on"
    reviewed: ""
    lines:
      - [Олег, "Можно примерить эту куртку?", "Can I try on this jacket?"]
      - [Продавец, "Конечно. Какой у вас размер?", "Of course. What is your size?"]
      - [Олег, "Пятидесятый.", "Fifty."]
      - [Продавец, "Вот. Есть синяя и чёрная.", "Here you are. There is a blue one and a black one."]
      - [Олег, "Синяя маленькая. Дайте, пожалуйста, чёрную.", "The blue one is small. The black one, please."]
      - [Продавец, "Как вам?", "How is it?"]
      - [Олег, "Отлично. Я её возьму.", "Great. I will take it."]
  - title: "What to wear"
    reviewed: ""
    lines:
      - [Анна, "На улице холодно. Надень шапку.", "It is cold outside. Put on a hat."]
      - [Олег, "Не хочу. Я не ношу шапки.", "I do not want to. I do not wear hats."]
      - [Анна, "Тогда надень хотя бы тёплую куртку.", "Then at least put on a warm jacket."]
      - [Олег, "Хорошо. А где мои ботинки?", "All right. Where are my boots?"]
      - [Анна, "Под диваном.", "Under the sofa."]
