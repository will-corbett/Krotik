  - title: "Is it getting warmer?"
    reviewed: ""
    lines:
      - [Олег, "Ты заметила, что зимы стали теплее?", "Have you noticed that the winters have got warmer?"]
      - [Анна, "Да. Учёные говорят, что это глобальное потепление.", "Yes. Scientists say it is global warming."]
      - [Олег, "И что можно сделать?", "And what can be done?"]
      - [Анна, "Сокращать выбросы и использовать солнечную энергию.", "Cut emissions and use solar energy."]
