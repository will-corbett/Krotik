title: Time, days and dates
ru: Время и дни
level: A1
blurb: Telling the time, days of the week, months and plans.
names: []
groups:
  - title: Time
    words: ["время = time", "час = hour", "минута = minute", секунда, "рано = early", "поздно = late", "сейчас = now, right away", "скоро = soon"]
  - title: Days and weeks
    words: [понедельник, вторник, "среда = Wednesday", четверг, пятница, суббота, воскресенье, неделя, выходные]
  - title: Months and years
    words: ["месяц = month", год, январь, май, сентябрь, декабрь, "весна = spring", лето, осень, зима]
  - title: Yesterday, today, tomorrow
    words: [вчера, сегодня, завтра, всегда, "никогда = never", иногда, часто]
dialogues:
  - title: "What time is it?"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Анна, "Сколько сейчас времени?", "What time is it now?"]
      - [Олег, "Без пяти восемь.", "Five to eight."]
      - [Анна, "Уже? Я опаздываю!", "Already? I am late!"]
      - [Олег, "Во сколько у тебя урок?", "What time is your lesson?"]
      - [Анна, "В восемь. Ничего, скоро буду там.", "At eight. Never mind, I will be there soon."]
  - title: "Making plans"
    reviewed: "a native speaker, 2026-11-08"
    lines:
      - [Олег, "Что ты делаешь в субботу?", "What are you doing on Saturday?"]
      - [Анна, "В субботу я работаю. А в воскресенье свободна.", "I am working on Saturday. But I am free on Sunday."]
      - [Олег, "Давай пойдём в кино в воскресенье вечером.", "Let's go to the cinema on Sunday evening."]
      - [Анна, "Давай. Во сколько?", "All right. What time?"]
      - [Олег, "В семь часов.", "At seven o'clock."]
      - [Анна, "Хорошо, до воскресенья!", "Good, see you on Sunday!"]
