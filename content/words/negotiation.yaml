title: Negotiation and agreement
ru: Переговоры
level: C1
blurb: "Proposals, conditions, compromise and reaching an agreement."
names: []
# Hand-chosen In use sentences (Tatoeba ids), where the shortest was an idiom or another sense of the word.
use:
  сторона: 5700700
  позиция: 4206201
groups:
  - title: "At the table"
    words: ["переговоры = negotiations, talks", "сторона = party, side", "предложение = proposal, offer", "условие = condition, term", "требование = demand, requirement", "интерес = interest", "позиция = position, stance"]
  - title: "Reaching agreement"
    words: ["компромисс = compromise", "уступка = concession", "договорённость = agreement, arrangement", "соглашение = agreement", "сделка = deal", "согласие = consent, agreement", "отказ = refusal"]
  - title: "Negotiating"
    words: ["предлагать = propose, offer", "обсуждать = discuss", "настаивать = insist", "уступить = concede, give way", "договориться = come to an agreement", "отказаться = refuse, turn down", "взаимный = mutual", "выгодный = advantageous"]
dialogues:
  - title: "The terms"
    reviewed: ""
    lines:
      - [Анна, "Мы рассмотрели ваше предложение. Условия нас в целом устраивают.", "We've considered your proposal. On the whole the terms suit us."]
      - [Олег, "Рад это слышать. Какие у вас требования?", "I'm glad to hear it. What are your requirements?"]
      - [Анна, "Мы настаиваем на более коротком сроке поставки.", "We insist on a shorter delivery time."]
      - [Олег, "Это сложно, но мы готовы пойти на уступку, если вы увеличите заказ.", "That's difficult, but we're ready to make a concession if you increase the order."]
      - [Анна, "Думаю, мы сможем договориться.", "I think we can reach an agreement."]
  - title: "A compromise"
    reviewed: ""
    lines:
      - [Дима, "Ты хочешь в горы, а я на море. Что будем делать?", "You want to go to the mountains and I want the sea. What shall we do?"]
      - [Катя, "Давай найдём компромисс: неделю в горах, неделю на море.", "Let's find a compromise: a week in the mountains and a week at the sea."]
      - [Дима, "Согласен. Это взаимная уступка.", "Agreed. It's a concession on both sides."]
      - [Катя, "Значит, договорились!", "So it's a deal!"]
