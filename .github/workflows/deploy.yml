# Build the data from its sources, run every check, and deploy the static site to GitHub Pages.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_retry:
        description: 'Skip the first deploy attempt, to check the automatic retry works'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Raw sources (~140 MB: OpenRussian, Tatoeba, Wiktionary) are cached per month, so the data is
      # rebuilt from fresh sources once a month and otherwise from the same files.
      - name: Month for the source cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data-raw
          key: data-raw-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/lib/sources.ts') }}

      - name: Build data (fetch sources, clean, validate, shard)
        run: npm run data

      - name: Upload the validation report
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: reports/validation.md

      - run: npm run check
      - run: npm test

      # The test browser is cached (keyed to the Playwright version in the lockfile); the system libraries it needs
      # are still installed each time.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Keep the traces of failed browser tests (playwright.config.ts retains them) so a failure can be seen.
      - name: Upload failed test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      # A healthy deploy takes about 10 seconds, but GitHub Pages sometimes leaves one stuck at "deployment_queued" or
      # "syncing_files", and a fresh deployment usually gets through. So give up on an attempt after 3 minutes and
      # try again, allowing longer each time (5, then 10 minutes) in case Pages is just slow. A deployment can only be
      # named after a real commit, so the retries reuse this one. If all three stall, push an empty commit. Run this
      # workflow by hand with test_retry to check the retry path.
      - id: deployment
        if: ${{ !inputs.test_retry }}
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 180000

      - name: Wait before retrying
        if: ${{ inputs.test_retry || steps.deployment.outcome == 'failure' }}
        run: sleep 15

      - id: retry
        name: Retry the deployment
        if: ${{ inputs.test_retry || steps.deployment.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 300000

      - name: Wait before the last try
        if: ${{ steps.retry.outcome == 'failure' }}
        run: sleep 15

      - id: retry2
        name: Last try
        if: ${{ steps.retry.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
