# Build the data from its sources, run every check, and deploy the static site to GitHub Pages.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_retry:
        description: 'Skip the first deploy attempt, to check the automatic retry works'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Raw sources (~140 MB: OpenRussian, Tatoeba, Wiktionary) are cached per month, so the data is
      # rebuilt from fresh sources once a month and otherwise from the same files.
      - name: Month for the source cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data-raw
          key: data-raw-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/lib/sources.ts') }}

      - name: Build data (fetch sources, clean, validate, shard)
        run: npm run data

      - name: Upload the validation report
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: reports/validation.md

      - run: npm run check
      - run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub Pages sometimes stalls at "syncing_files" and the step times out after 10 minutes. The stall sticks to
      # that deployment (named after the commit), so the retry below starts a fresh one under a different name.
      - id: deployment
        if: ${{ !inputs.test_retry }}
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Fetch the deploy action for a retry
        if: ${{ inputs.test_retry || steps.deployment.outcome == 'failure' }}
        uses: actions/checkout@v7
        with:
          repository: actions/deploy-pages
          ref: v5
          path: .deploy-pages

      # The same official action again, as a fresh deployment named <commit>-retry-<attempt> (a workflow can't
      # override GITHUB_SHA through `env:`, but a child process can). It runs inside a JavaScript step because only
      # those get the Actions runtime token the deploy needs to read the uploaded site; a plain `run:` step doesn't.
      - id: retry
        name: Retry with a fresh deployment
        if: ${{ inputs.test_retry || steps.deployment.outcome == 'failure' }}
        uses: actions/github-script@v9
        env:
          RETRY_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            execFileSync('node', ['.deploy-pages/dist/index.js'], {
              stdio: 'inherit',
              env: {
                ...process.env,
                GITHUB_SHA: `${process.env.GITHUB_SHA}-retry-${process.env.GITHUB_RUN_ATTEMPT}`,
                INPUT_TOKEN: process.env.RETRY_TOKEN,
                INPUT_TIMEOUT: '600000',
                INPUT_ERROR_COUNT: '10',
                INPUT_REPORTING_INTERVAL: '5000',
                INPUT_ARTIFACT_NAME: 'github-pages',
                INPUT_PREVIEW: 'false',
              },
            });
